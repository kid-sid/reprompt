<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reprompt • AI Copilot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-surface-0: #050509;
      --color-surface-1: #0f1117;
      --color-surface-2: #111521;
      --color-surface-3: #1a1f2e;
      --color-surface-4: #232a3b;
      --color-accent: #4f46e5;
      --color-accent-strong: #6366f1;
      --color-success: #22c55e;
      --color-danger: #ef4444;
      --color-warning: #f59e0b;
      --color-text-strong: #f9fafb;
      --color-text: #d1d5db;
      --color-text-subtle: #9ca3af;
      --color-border: rgba(148, 163, 184, 0.18);
      --color-border-strong: rgba(148, 163, 184, 0.35);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --shadow-elevated: 0 24px 60px rgba(15, 23, 42, 0.45);
      --shadow-float: 0 16px 40px -10px rgba(79, 70, 229, 0.45);
      --sidebar-width: 280px;
      /* Legacy tokens for script compatibility */
      --primary-color: #4f46e5;
      --secondary-color: #ec4899;
      --accent-color: #22c55e;
      --danger-color: var(--color-danger);
      --warning-color: var(--color-warning);
      --text-primary: var(--color-text-strong);
      --text-secondary: var(--color-text);
      --text-muted: var(--color-text-subtle);
      --bg-primary: rgba(15, 23, 42, 0.88);
      --bg-secondary: rgba(15, 23, 42, 0.65);
      --bg-tertiary: rgba(30, 41, 59, 0.45);
      --border-hover: rgba(148, 163, 184, 0.45);
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(79, 70, 229, 0.18) 0%, rgba(2, 6, 23, 0) 55%),
                  radial-gradient(circle at 80% 0%, rgba(236, 72, 153, 0.2) 0%, rgba(2, 6, 23, 0) 45%),
                  var(--color-surface-0);
      color: var(--color-text);
      min-height: 100vh;
      overflow: hidden;
    }

    .app-shell {
      display: flex;
      height: 100vh;
      width: 100%;
      backdrop-filter: blur(14px);
      background: linear-gradient(160deg, rgba(15,17,23,0.92) 0%, rgba(14,16,24,0.88) 60%, rgba(9, 11, 18, 0.92) 100%);
    }

    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, rgba(17, 19, 27, 0.95) 0%, rgba(12, 14, 25, 0.93) 100%);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.25rem;
      gap: 1.5rem;
    }

    .sidebar-header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .logo-lockup {
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: var(--color-text-subtle);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-lg);
      background: rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.18);
      box-shadow: inset 0 0 0 1px rgba(99, 102, 241, 0.1);
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.85), rgba(67, 56, 202, 0.75));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-strong);
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .user-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .user-name {
      color: var(--color-text-strong);
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 0.78rem;
      color: var(--color-text-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-controls {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .new-chat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.95rem 1rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.85), rgba(129, 140, 248, 0.85));
      color: var(--color-text-strong);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(129, 140, 248, 0.45);
      box-shadow: var(--shadow-float);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .new-chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 50px -15px rgba(99, 102, 241, 0.8);
    }

    .sidebar-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(148, 163, 184, 0.1);
      background: rgba(9, 11, 20, 0.45);
      overflow: hidden;
    }

    .history-title {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(226, 232, 240, 0.55);
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      scrollbar-width: thin;
    }

    .chat-history-list::-webkit-scrollbar {
      width: 6px;
    }

    .chat-history-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-history-list::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 999px;
    }

    .chat-history-item {
      border-radius: var(--radius-md);
      padding: 0.75rem 0.85rem;
      border: 1px solid transparent;
      background: rgba(30, 41, 59, 0.2);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.25s ease;
    }

    .chat-history-item:hover {
      border-color: rgba(129, 140, 248, 0.35);
      background: rgba(79, 70, 229, 0.18);
      transform: translateX(3px);
    }

    .chat-history-preview {
      color: var(--color-text);
      font-size: 0.82rem;
      line-height: 1.4;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .chat-history-meta {
      margin-top: 0.55rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: rgba(148, 163, 184, 0.55);
    }

    .chat-history-mode {
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.08em;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .chat-history-mode.lazy {
      color: var(--color-success);
      border-color: rgba(34, 197, 94, 0.35);
      background: rgba(34, 197, 94, 0.12);
    }

    .chat-history-mode.pro {
      color: rgba(129, 140, 248, 0.85);
      border-color: rgba(129, 140, 248, 0.35);
      background: rgba(99, 102, 241, 0.12);
    }

    .sidebar-footer {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .settings-btn {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(30, 41, 59, 0.35);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: var(--radius-lg);
      color: var(--color-text-subtle);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .settings-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(129, 140, 248, 0.25);
      color: var(--color-text);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle at top, rgba(76, 29, 149, 0.24), transparent 55%),
                  radial-gradient(circle at bottom, rgba(22, 101, 214, 0.18), transparent 55%),
                  var(--color-surface-1);
    }

    .header {
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.82), rgba(17, 24, 39, 0.62));
      backdrop-filter: saturate(160%) blur(8px);
    }

    .inference-mode-switch {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      background: rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(129, 140, 248, 0.2);
    }

    .mode-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(226, 232, 240, 0.75);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .mode-toggle {
      width: 48px;
      height: 24px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.22);
      position: relative;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    .mode-toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-text-strong);
      transition: transform 0.25s ease;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.35);
    }

    .mode-toggle.active {
      background: rgba(99, 102, 241, 0.45);
    }

    .mode-toggle.active::after {
      transform: translateX(24px);
    }

    .mode-info {
      font-size: 0.78rem;
      color: rgba(203, 213, 225, 0.75);
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .logout-btn {
      padding: 0.6rem 1.05rem;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: rgba(248, 250, 252, 0.88);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .logout-btn:hover {
      transform: translateY(-1px);
      background: rgba(239, 68, 68, 0.28);
    }

    .chat-container {
      flex: 1;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1.5rem;
    }

    .chat-messages {
      width: min(960px, 100%);
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scrollbar-width: thin;
    }

    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
    }

    .welcome-message {
      margin-top: 12vh;
      text-align: center;
      color: rgba(226, 232, 240, 0.65);
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      align-items: center;
    }

    .welcome-title {
      font-size: clamp(2.25rem, 4vw, 3rem);
      font-weight: 700;
      color: var(--color-text-strong);
      letter-spacing: -0.04em;
    }

    .welcome-subtitle {
      font-size: 1.05rem;
      line-height: 1.65;
      max-width: 520px;
      color: rgba(226, 232, 240, 0.55);
    }

    .message {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      padding: 1.35rem 1.75rem;
      border-radius: var(--radius-lg);
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 60px -30px rgba(15, 23, 42, 0.85);
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: var(--color-text-strong);
      background: rgba(79, 70, 229, 0.35);
      border: 1px solid rgba(129, 140, 248, 0.45);
      box-shadow: inset 0 0 20px rgba(129, 140, 248, 0.2);
    }

    .user-message {
      background: rgba(79, 70, 229, 0.14);
      border: 1px solid rgba(99, 102, 241, 0.28);
    }

    .user-message .message-avatar {
      background: rgba(99, 102, 241, 0.75);
      border-color: rgba(129, 140, 248, 0.6);
      box-shadow: inset 0 0 20px rgba(237, 233, 254, 0.35);
    }

    .message-content {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .message-role {
      color: rgba(226, 232, 240, 0.92);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .message-actions {
      display: flex;
      gap: 0.45rem;
      align-items: center;
    }

    .message-actions.top-actions {
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }

    .message:hover .message-actions.top-actions {
      opacity: 1;
    }

    .message-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(30, 41, 59, 0.45);
      color: rgba(226, 232, 240, 0.65);
      font-size: 0.75rem;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .message-action-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(129, 140, 248, 0.55);
      color: var(--color-text-strong);
    }

    .message-action-btn.copied {
      background: rgba(34, 197, 94, 0.25);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--color-text-strong);
    }

    .message-action-btn .copy-icon {
      transition: transform 0.2s ease;
    }

    .message-action-btn .copy-feedback {
      display: none;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .message-action-btn.copied .copy-icon {
      display: none;
    }

    .message-action-btn.copied .copy-feedback {
      display: inline;
    }

    .message-text {
      line-height: 1.75;
      color: rgba(226, 232, 240, 0.88);
      font-size: 0.97rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-text strong {
      color: var(--color-text-strong);
    }

    .message-text code {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 0.2rem 0.45rem;
      border-radius: var(--radius-sm);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.85rem;
    }

    .message-actions.bottom-actions {
      gap: 0.65rem;
    }

    .like-btn,
    .dislike-btn {
      padding: 0.4rem 0.55rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(30, 41, 59, 0.55);
      color: rgba(226, 232, 240, 0.65);
    }

    .like-btn:hover {
      border-color: rgba(244, 63, 94, 0.65);
      color: rgba(248, 113, 113, 0.9);
    }

    .dislike-btn:hover {
      border-color: rgba(148, 163, 184, 0.55);
      color: rgba(226, 232, 240, 0.85);
    }

    .like-btn.liked {
      background: rgba(244, 63, 94, 0.35);
      border-color: rgba(248, 113, 113, 0.55);
      color: #fef2f2;
      transform: scale(1.05);
    }

    .dislike-btn.disliked {
      background: rgba(148, 163, 184, 0.35);
      border-color: rgba(148, 163, 184, 0.6);
      color: #f1f5f9;
      transform: scale(1.05);
    }

    .message-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.75rem;
      color: rgba(148, 163, 184, 0.75);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .loading-message {
      width: min(960px, 100%);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.35rem 1.75rem;
      border-radius: var(--radius-lg);
      background: rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(129, 140, 248, 0.2);
      backdrop-filter: blur(12px);
      color: rgba(226, 232, 240, 0.65);
    }

    .loading-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5f3ff;
      border: 1px solid rgba(129, 140, 248, 0.45);
    }

    .loading-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .loading-spinner {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 3px solid rgba(148, 163, 184, 0.2);
      border-top-color: rgba(129, 140, 248, 0.65);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .scroll-to-bottom {
      position: fixed;
      bottom: 124px;
      right: 52px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.9), rgba(99, 102, 241, 0.95));
      color: var(--color-text-strong);
      border: 1px solid rgba(129, 140, 248, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px -20px rgba(79, 70, 229, 0.85);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      cursor: pointer;
      z-index: 20;
    }

    .scroll-to-bottom.visible {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }

    .input-container {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 1rem 1.5rem 1.75rem;
      position: relative;
      background: linear-gradient(180deg, rgba(15, 17, 27, 0.4), rgba(5, 7, 12, 0.95));
      border-top: 1px solid rgba(148, 163, 184, 0.18);
    }

    .input-form {
      width: min(880px, 100%);
      display: flex;
      gap: 0.85rem;
      align-items: flex-end;
      background: rgba(15, 23, 42, 0.8);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 1rem 1.1rem;
      box-shadow: var(--shadow-elevated);
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    .prompt-input {
      width: 100%;
      background: transparent;
      border: none;
      resize: none;
      min-height: 52px;
      max-height: 180px;
      font-size: 0.98rem;
      line-height: 1.75;
      color: rgba(248, 250, 252, 0.88);
      padding-right: 2.2rem;
    }

    .prompt-input:focus {
      outline: none;
    }

    .prompt-input::placeholder {
      color: rgba(148, 163, 184, 0.55);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, rgba(129, 140, 248, 0.9), rgba(236, 72, 153, 0.85));
      color: var(--color-text-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.15s ease;
      box-shadow: 0 20px 45px -18px rgba(129, 140, 248, 0.85);
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 26px 55px -22px rgba(236, 72, 153, 0.85);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .input-helper {
      position: absolute;
      bottom: -1.8rem;
      right: 0.5rem;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.45);
      pointer-events: none;
    }

    @media (max-width: 1100px) {
      .app-shell {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        gap: 1rem;
        padding: 1rem 1.5rem;
        align-items: center;
      }

      .sidebar-content,
      .sidebar-footer {
        display: none;
      }

      .main-content {
        height: calc(100vh - 148px);
      }
    }

    @media (max-width: 768px) {
      body {
        overflow: hidden;
      }

      .header {
        justify-content: space-between;
        padding: 1rem 1.25rem;
      }

      .chat-container {
        padding: 1.25rem 1rem;
      }

      .chat-messages {
        padding: 1.25rem 0.5rem 1.5rem;
      }

      .message {
        padding: 1.1rem 1.2rem;
        gap: 0.8rem;
      }

      .message-avatar {
        width: 38px;
        height: 38px;
      }

      .input-form {
        border-radius: var(--radius-lg);
        padding: 0.85rem 0.9rem;
      }

      .send-btn {
        width: 44px;
        height: 44px;
      }

      .scroll-to-bottom {
        right: 28px;
        bottom: 108px;
      }
    }

    @media (max-width: 480px) {
      .app-shell {
        background: var(--color-surface-1);
      }

      .sidebar {
        flex-direction: column;
        align-items: stretch;
      }

      .user-profile {
        width: 100%;
      }

      .header {
        flex-direction: column;
        gap: 0.85rem;
        align-items: stretch;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" role="complementary" aria-label="Conversation sidebar">
      <div class="sidebar-header">
        <span class="logo-lockup">Reprompt Studio</span>
        <div class="user-profile">
          <div class="user-avatar" id="userAvatar" aria-label="User initials">
            <span id="userInitials">U</span>
          </div>
          <div class="user-info">
            <div class="user-name" id="userName">User</div>
            <div class="user-email" id="userEmail">user@example.com</div>
          </div>
        </div>
        <div class="sidebar-controls">
          <button class="new-chat-btn" id="newChatBtn" aria-label="Start a new chat">
            <span>＋</span>
            <span>New Conversation</span>
          </button>
        </div>
      </div>

      <div class="sidebar-content">
        <div class="history-title">Recent Sessions</div>
        <div class="chat-history-list" id="chatHistoryList" role="list" aria-label="Chat history">
          <!-- Items rendered by JS -->
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="settings-btn" id="settingsBtn" aria-label="Open settings">
          <span>⚙️</span>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <main class="main-content" role="main">
      <header class="header" role="banner">
        <div class="inference-mode-switch">
          <span class="mode-label">Mode</span>
          <div class="mode-toggle" id="inferenceToggle" role="switch" aria-checked="false" aria-label="Toggle inference mode"></div>
          <div class="mode-info" id="modeInfo">
            <span id="modeLabel">Lazy</span>
            <span id="modeDescription">(GPT-3.5)</span>
          </div>
        </div>

        <button class="logout-btn" id="logoutBtn" aria-label="Logout">
          <span>⎋</span>
          <span>Sign Out</span>
        </button>
      </header>

      <div class="chat-container">
        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Chat messages">
          <div class="welcome-message" id="welcomeMessage">
            <h1 class="welcome-title">How can Reprompt help today?</h1>
            <p class="welcome-subtitle">
              Describe your task or prompt idea and Reprompt will optimize it for the right model.
              Switch between Lazy (GPT‑3.5) and Pro (GPT‑4) anytime.
            </p>
          </div>
        </div>

        <button class="scroll-to-bottom" id="scrollToBottom" aria-label="Scroll to latest message">
          <span>⬇</span>
        </button>
      </div>

      <div class="input-container">
        <form class="input-form" id="promptForm" role="form" aria-label="Prompt input form">
          <div class="input-wrapper">
            <textarea
              class="prompt-input"
              id="promptInput"
              placeholder="Send a message..."
              rows="1"
              aria-label="Write your message"
              aria-describedby="input-help"
            ></textarea>
            <div id="input-help" class="input-helper">
              Press Enter to send • Shift+Enter for newline
            </div>
          </div>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="/static/config.js"></script>
  <script type="module" src="/static/chatbot.js"></script>
</body>
</html>
